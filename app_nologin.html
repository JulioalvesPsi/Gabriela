<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Palavras da Gabriela</title>
<style>html,body{margin:0;width:100%;height:100%;background:#fff6ee}iframe{border:0;width:100%;height:100%;display:block}</style>
</head>
<body>
<iframe id="app" src="app.html?v=29" title="Palavras da Gabriela"></iframe>
<script>
(function(){
  const m=location.hash.match(/(?:^#|[&#])access=([^&]+)/);
  if(m&&m[1]){
    try{localStorage.setItem('gabriela_family_access_v1',decodeURIComponent(m[1]))}catch{}
    history.replaceState(null,'',location.pathname+location.search);
  }
  const frame=document.getElementById('app');
  frame.addEventListener('load',()=>{
    try{
      const photos=frame.contentDocument.createElement('script');photos.src='extra_photos.js?v=29';frame.contentDocument.body.appendChild(photos);
      const more=frame.contentDocument.createElement('script');more.src='extra_photos_more.js?v=29';frame.contentDocument.body.appendChild(more);
      const batch3=frame.contentDocument.createElement('script');batch3.src='extra_photos_batch3.js?v=29';frame.contentDocument.body.appendChild(batch3);
      const batch3more=frame.contentDocument.createElement('script');batch3more.src='extra_photos_batch3_more.js?v=29';frame.contentDocument.body.appendChild(batch3more);
      const patch=frame.contentDocument.createElement('script');patch.src='adaptive_patch.js?v=29';frame.contentDocument.body.appendChild(patch);
      const cloud=frame.contentDocument.createElement('script');cloud.src='cloud_auto.js?v=29';frame.contentDocument.body.appendChild(cloud);
    }catch(e){console.error(e)}
  });
})();
</script>
</body>
</html>
