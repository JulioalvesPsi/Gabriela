<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Palavras da Gabriela</title>
<style>html,body{margin:0;width:100%;height:100%;background:#fff6ee}iframe{border:0;width:100%;height:100%;display:block}</style>
</head>
<body>
<iframe id="app" src="app.html?v=25" title="Palavras da Gabriela"></iframe>
<script>
(function(){
  const m=location.hash.match(/(?:^#|[&#])access=([^&]+)/);
  if(m&&m[1]){
    try{localStorage.setItem('gabriela_family_access_v1',decodeURIComponent(m[1]))}catch{}
    history.replaceState(null,'',location.pathname+location.search);
  }
  const frame=document.getElementById('app');
  frame.addEventListener('load',()=>{
    try{
      const s=frame.contentDocument.createElement('script');
      s.src='cloud_auto.js?v=25';
      frame.contentDocument.body.appendChild(s);
    }catch(e){console.error(e)}
  });
})();
</script>
</body>
</html>
